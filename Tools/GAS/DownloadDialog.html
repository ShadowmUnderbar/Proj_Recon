<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      color: #333;
    }
    p { margin: 0 0 12px; font-size: 14px; white-space: pre-line; }
    button {
      padding: 6px 20px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <p id="status">ファイルを準備しています...</p>
  <button onclick="google.script.host.close()">閉じる</button>

  <script>
    // GASテンプレートからファイル配列（{ fileName, content }）を受け取る
    const files = <?!= JSON.stringify(files) ?>;

    // 1ファイルをBOM付きBlobとしてダウンロードする
    function downloadFile(file) {
      const bom  = '﻿'; // BOM付きでExcel/エディタの文字化けを防ぐ
      const blob = new Blob([bom + file.content], { type: 'text/plain;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href     = url;
      a.download = file.fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      URL.revokeObjectURL(url);
    }

    window.onload = function () {
      const status = document.getElementById('status');
      try {
        // 複数ファイルを連続DLするとブラウザにブロックされやすいため、
        // 1件ずつ間隔（400ms）を空けて発火する
        files.forEach(function (file, i) {
          setTimeout(function () { downloadFile(file); }, i * 400);
        });

        const names = files.map(function (f) { return f.fileName; }).join('\n');
        status.textContent =
          files.length + ' 件のダウンロードを開始しました:\n' + names;
      } catch (e) {
        status.textContent = 'ダウンロードに失敗しました: ' + e.message;
      }
    };
  </script>
</body>
</html>
